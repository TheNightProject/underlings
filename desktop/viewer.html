<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<title>Artifact</title>
<style>
:root { --bar: 40px; --hint: 48px; --bg: #0f131a; --fg: #e6eaf1; --muted: #9aa3b3; --line: #232a36; --hover: #202734; --accent: #8aa8ff; --accent-soft: rgba(122, 156, 255, 0.14); color-scheme: dark; }
@media (prefers-color-scheme: light) {
  :root { --bg: #eceff5; --fg: #121722; --muted: #5a6476; --line: #dde2ea; --hover: #e1e5ec; --accent: #3b63e0; --accent-soft: rgba(59, 99, 224, 0.1); color-scheme: light; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font: 13px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
header { height: var(--bar); display: flex; align-items: center; gap: 2px; padding: 0 8px 0 80px; border-bottom: 1px solid var(--line); -webkit-app-region: drag; }
button { -webkit-app-region: no-drag; display: inline-grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 7px; background: none; color: var(--muted); }
button:hover:not(:disabled) { background: var(--hover); color: var(--fg); }
button:disabled { opacity: 0.35; }
button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; padding: 0 10px; white-space: nowrap; }
#title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
#where { flex: none; color: var(--muted); font-size: 12px; }
#hint { height: var(--hint); margin: 0; padding: 0 16px; display: flex; align-items: center; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
#hint[hidden] { display: none; }
</style>
</head>
<body>
<header>
  <button type="button" id="back" data-run="back" title="Back" aria-label="Back" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
  <button type="button" id="forward" data-run="forward" title="Forward" aria-label="Forward" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
  <button type="button" id="reload" data-run="reload" title="Reload" aria-label="Reload"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
  <div class="title"><span id="title"></span><span id="where"></span></div>
  <button type="button" id="copy" data-run="copy" title="Copy link" aria-label="Copy link"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
  <button type="button" id="browser" data-run="browser" title="Open in browser" aria-label="Open in browser"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></button>
  <button type="button" id="top" data-run="top" title="Keep on top of every window" aria-label="Keep on top of every window" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg></button>
</header>
<p id="hint" hidden>If Google will not sign you in here, choose Continue with email instead and type the code from that email into this window.</p>
<script src="viewer.js"></script>
</body>
</html>
