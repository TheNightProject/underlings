name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            engine/package-lock.json
            desktop/package-lock.json

      - name: Check the tag is the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          stamped="$(node -p "require('./package.json').version")"
          if [ "$stamped" != "$version" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but package.json says $stamped"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm run setup

      # A release build names no checkout, so the app it makes updates through Homebrew rather than git.
      - name: Build the app
        env:
          UNDERLINGS_RELEASE: '1'
        run: npm --prefix desktop run dist

      - name: Zip the app
        id: zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip="Underlings-$VERSION-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent desktop/dist.noindex/mac-arm64/Underlings.app "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      # The release notes are the version's section of CHANGELOG.md, which the app reads back as its update notes.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.zip.outputs.zip }}
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { parseChangelog } from './lib/changelog.mjs';
            const section = parseChangelog(readFileSync('CHANGELOG.md', 'utf8')).sections.find((s) => s.version === process.env.VERSION);
            if (!section) throw new Error('CHANGELOG.md has no section for ' + process.env.VERSION);
            process.stdout.write(section.body + '\n');
          " > notes.md
          gh release create "$GITHUB_REF_NAME" "$ZIP" --verify-tag --title "Underlings $VERSION" --notes-file notes.md

      - name: Update the Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.zip.outputs.sha256 }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::there is no HOMEBREW_TAP_TOKEN secret, so the cask in TheNightProject/homebrew-tap was not updated"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/TheNightProject/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/{{VERSION}}/$VERSION/" -e "s/{{SHA256}}/$SHA256/" -e '1{/^#/d;}' scripts/homebrew/underlings.rb > tap/Casks/underlings.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/underlings.rb
          git commit -m "Underlings $VERSION"
          git push
